<!DOCTYPE html>
<html>
<head>
    <title>Student Result Predictor</title>
    <style>
        body{
            font-family: Arial;
            text-align:center;
            margin-top:100px;
            background:#f2f2f2;
        }

        .box{
            background:white;
            width:400px;
            margin:auto;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        input{
            padding:10px;
            width:80%;
            margin:10px;
        }

        button{
            padding:10px 20px;
            background:blue;
            color:white;
            border:none;
            border-radius:5px;
        }

        h1{
            color:blue;
        }
    </style>
</head>
<body>

<div class="box">
    <h1>Student Result Predictor</h1>

    <form method="POST">
        <input type="number" step="0.1" name="hours"
        placeholder="Enter study hours" required>

        <br>

        <button type="submit">Predict Marks</button>
    </form>

    {% if prediction %}
        <h2>Predicted Marks: {{ prediction|round(2) }}</h2>
    {% endif %}
</div>

</body>
</html>
